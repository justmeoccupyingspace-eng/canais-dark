name: scf
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy
      - run: |
          mkdir -p /tmp/o && python3 scripts/scf.py /tmp/o/scf2025.json | tee /tmp/o/log.txt
          curl -sL -A "Mozilla/5.0" -o /tmp/o/scf26.pdf https://www.federalreserve.gov/publications/files/scf26.pdf && sudo apt-get install -y -qq poppler-utils >/dev/null && pdftotext -layout /tmp/o/scf26.pdf /tmp/o/scf26.txt || true
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git checkout --orphan scf-${{ github.run_id }} && git rm -rf . -q
          cp /tmp/o/* . && git add . && git commit -qm scf && git push -f origin scf-${{ github.run_id }}
