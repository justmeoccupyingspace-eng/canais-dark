name: uatest
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          tests = [("incompetech", "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Inspired.mp3"),
                   ("fed", "https://www.federalreserve.gov/econres/files/scfp2025excel.zip")]
          for ua in (None, "canais-dark-bot/1.0 (+https://github.com/justmeoccupyingspace-eng/canais-dark)"):
              for name, url in tests:
                  h = {"User-Agent": ua} if ua else {}
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers=h, method="GET"), timeout=60)
                      n = len(r.read(200000))
                      print(f"::notice::{name} UA={ua or 'python-default'} -> {r.status} ({n} bytes read)")
                  except urllib.error.HTTPError as e:
                      print(f"::notice::{name} UA={ua or 'python-default'} -> HTTP {e.code}")
                  except Exception as e:
                      print(f"::notice::{name} UA={ua or 'python-default'} -> {type(e).__name__} {e}")
          PY
