name: basemap
on:
  workflow_dispatch:
    inputs:
      title: {description: "arquivo do Commons", required: false, default: "File:Whole world - land and oceans 12000.jpg"}
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy pillow
      - run: python3 scripts/basemap.py
        env: {TITLE: "${{ inputs.title }}"}
      - run: |
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git add public/geo && git commit -qm "fundo de mapa em relevo (NASA, domínio público) em Mercator" && git push origin HEAD:main
