name: mine
run-name: mine ${{ inputs.dump != '' && 'dump' || 'pautas' }}
on:
  workflow_dispatch:
    inputs:
      dump: {description: "JSON p/ wbdump (vazio = garimpo)", required: false, default: ""}
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail
          if [ -n '${{ inputs.dump }}' ]; then python3 scripts/wbdump.py '${{ inputs.dump }}' /tmp/mine.json 2>&1 | tee /tmp/log; else python3 scripts/mine.py /tmp/mine.json 2>&1 | tee /tmp/log; fi || { echo "::error title=mine::$(tail -c 1500 /tmp/log | tr '\n' ' ')"; exit 1; }
      - run: |
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git checkout --orphan mine-${{ github.run_id }} && git rm -rf . -q
          cp /tmp/mine.json mine.json && git add mine.json && git commit -qm mine && git push -f origin mine-${{ github.run_id }}
