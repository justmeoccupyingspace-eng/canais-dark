name: voiceB
on:
  workflow_dispatch:
    inputs:
      voices: {description: "vozes separadas por vírgula", required: false, default: "Gacrux,Sadaltager,Algieba"}
      model: {description: "modelo TTS", required: false, default: "gemini-3.8-flash-tts"}
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy scipy soundfile librosa num2words
      - run: python voicetest/voiceB.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          VOICES: ${{ inputs.voices }}
          MODEL: ${{ inputs.model }}
      - run: |
          mkdir -p /tmp/vb && for w in out_vb/*.wav; do ffmpeg -v error -y -i "$w" -b:a 96k /tmp/vb/$(basename ${w%.wav}).mp3; done; cp out_vb/report.json /tmp/vb/
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git checkout --orphan voiceB-${{ github.run_id }} && git rm -rf . -q
          cp /tmp/vb/* . && git add . && git commit -qm voiceB && git push -f origin voiceB-${{ github.run_id }}
