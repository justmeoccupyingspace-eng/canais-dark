name: ytresched
on:
  workflow_dispatch:
    inputs:
      ids: {description: "IDs separados por vírgula", required: true}
      at: {description: "publishAt (UTC ISO) separados por vírgula, mesma ordem", required: true}
      ch: {description: "A ou B", required: true}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ytresched.py
        env:
          IDS: ${{ inputs.ids }}
          AT: ${{ inputs.at }}
          CH: ${{ inputs.ch }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_A: ${{ secrets.YT_REFRESH_A }}
          YT_REFRESH_B: ${{ secrets.YT_REFRESH_B }}
