name: produce
on:
  push:
    branches: [main]
    paths: ["specs/queue/*.json"]
  workflow_dispatch:
    inputs:
      spec:
        description: "Arquivo em specs/ (ex.: specs/demo.json)"
        required: true
        default: "specs/demo.json"
      channel:
        description: "A = Chartbound, B = How It Ticks"
        required: true
        default: "A"
      privacy:
        description: "private | unlisted | public"
        required: true
        default: "public"
      upload:
        description: "Enviar ao YouTube? (true/false)"
        required: true
        default: "true"
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        id: kcache
        with:
          path: .cache/kokoro
          key: kokoro-v1.0
      - name: Modelos de voz
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o .cache/kokoro/kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          curl -sSL -o .cache/kokoro/voices-v1.0.bin $B/voices-v1.0.bin
      - run: pip install kokoro-onnx soundfile scipy num2words edge-tts librosa faster-whisper
      - name: ffmpeg e fontes (com timeout e nova tentativa)
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji && break
            echo "apt falhou/travou (tentativa $i)"; sleep 10
          done
          command -v ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Escolher specs
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --no-renames --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'specs/queue/*.json' > list.txt || true
          else
            echo "${{ inputs.spec }}" > list.txt
          fi
          cat list.txt
          echo "n=$(grep -c . list.txt || true)" >> $GITHUB_OUTPUT
      - name: Produzir
        if: steps.pick.outputs.n != '0'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_A: ${{ secrets.YT_REFRESH_A }}
          YT_REFRESH_B: ${{ secrets.YT_REFRESH_B }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          GDRIVE_REFRESH: ${{ secrets.GDRIVE_REFRESH }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          MANUAL_PRIVACY: ${{ inputs.privacy }}
          MANUAL_UPLOAD: ${{ inputs.upload }}
        run: bash scripts/produce.sh list.txt
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.n != '0'
        with: {name: videos, path: out/*.mp4, retention-days: 7}
      - name: Prévia na branch previews
        if: steps.pick.outputs.n != '0'
        run: |
          mkdir -p /tmp/pv && cp out/*.mp4 /tmp/pv/
          git config user.name "producer"; git config user.email "producer@users.noreply.github.com"
          B=previews; [ "${{ inputs.channel }}" = "C" ] && B=pv-${{ github.run_id }}
          git checkout --orphan $B && git rm -rf . -q
          cp /tmp/pv/*.mp4 . && git add *.mp4 && git commit -qm "previews" && git push -f origin $B
