name: produce
on:
  push:
    branches: [main]
    paths: ["specs/queue/*.json"]
  workflow_dispatch:
    inputs:
      spec:
        description: "Arquivo em specs/ (ex.: specs/demo.json)"
        required: true
        default: "specs/demo.json"
      channel:
        description: "A = Chartbound, B = How It Ticks"
        required: true
        default: "A"
      privacy:
        description: "private | unlisted | public"
        required: true
        default: "public"
      upload:
        description: "Enviar ao YouTube? (true/false)"
        required: true
        default: "true"
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        id: kcache
        with:
          path: .cache/kokoro
          key: kokoro-v1.0
      - name: Modelos de voz
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o .cache/kokoro/kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          curl -sSL -o .cache/kokoro/voices-v1.0.bin $B/voices-v1.0.bin
      - run: pip install kokoro-onnx soundfile scipy num2words edge-tts librosa faster-whisper
      - name: ffmpeg e fontes (apt com timeout; ffmpeg estatico do PyPI se o apt travar)
        run: |
          for i in 1 2; do
            timeout 180 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji && break
            echo "apt falhou/travou (tentativa $i)"; sleep 5
          done
          if ! command -v ffmpeg >/dev/null; then
            pip install -q imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg as m; print(m.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
      - run: npm ci --no-audit --no-fund
      - name: Escolher specs
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --no-renames --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'specs/queue/*.json' > list.txt || true
          else
            echo "${{ inputs.spec }}" > list.txt
          fi
          cat list.txt
          echo "n=$(grep -c . list.txt || true)" >> $GITHUB_OUTPUT
      - name: Produzir
        if: steps.pick.outputs.n != '0'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_A: ${{ secrets.YT_REFRESH_A }}
          YT_REFRESH_B: ${{ secrets.YT_REFRESH_B }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          GDRIVE_REFRESH: ${{ secrets.GDRIVE_REFRESH }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          MANUAL_PRIVACY: ${{ inputs.privacy }}
          MANUAL_UPLOAD: ${{ inputs.upload }}
        run: |
          set -o pipefail
          bash scripts/produce.sh list.txt 2>&1 | tee produce.log
      - name: Log da falha na branch logs-<run>
        if: failure()
        run: |
          cp produce.log /tmp/produce.log || echo "sem log" > /tmp/produce.log
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git checkout --orphan logs-${{ github.run_id }} && git rm -rf . -q
          tail -c 60000 /tmp/produce.log > produce.log && git add produce.log && git commit -qm log && git push -f origin logs-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.n != '0'
        with: {name: videos, path: out/*.mp4, retention-days: 7}
      - name: Prévia na branch previews
        if: steps.pick.outputs.n != '0'
        run: |
          mkdir -p /tmp/pv && cp out/*.mp4 /tmp/pv/ && for m in out/*.mp4; do n=$(basename $m .mp4); cp public/build/$n.json /tmp/pv/$n.json 2>/dev/null || true; done
          git config user.name "producer"; git config user.email "producer@users.noreply.github.com"
          B=previews; [ "${{ inputs.channel }}" = "C" ] && B=pv-${{ github.run_id }}
          git checkout --orphan $B && git rm -rf . -q
          cp /tmp/pv/* . && git add -f -- *.mp4 *.json && git commit -qm "previews" && (git push -f origin $B || echo "previews: push concorrente ignorado (o upload ja foi feito)")
