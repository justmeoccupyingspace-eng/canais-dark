name: evalvid
on:
  workflow_dispatch:
    inputs:
      branches: {description: "branches pv-* separadas por espaço", required: true}
permissions:
  contents: write
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install faster-whisper librosa soundfile numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python voicetest/evalvid.py ${{ inputs.branches }}
      - name: Relatório na branch evalrep
        run: |
          cp relatorio_videos.txt /tmp/r.txt
          git config user.name producer; git config user.email producer@users.noreply.github.com
          git checkout --orphan evalrep && git rm -rf . -q
          cp /tmp/r.txt relatorio_videos.txt && git add relatorio_videos.txt && git commit -qm rel && git push -f origin evalrep
